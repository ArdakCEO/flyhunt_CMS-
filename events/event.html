<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Ивент — Flyhunt</title>
<meta name="description" id="pageDesc" content="">
<link rel="icon" type="image/png" href="/images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/main.css">
<link rel="stylesheet" href="/css/site-v2-chrome.css">
<style>
.page-wrap{padding:56px 24px 96px;max-width:760px;margin:0 auto}

.ev-cover{height:260px;border-radius:var(--radius);background:var(--grad);color:#fff;font-weight:900;font-size:44px;display:flex;align-items:center;justify-content:center;margin-bottom:28px;overflow:hidden}
.ev-cover img{width:100%;height:100%;object-fit:cover}
h1{font-size:clamp(28px,4vw,42px);line-height:1.15;margin:14px 0 24px}
.ev-body h4{font-size:16px;margin:22px 0 8px}
.ev-body p,.ev-body li{font-size:15.5px;line-height:1.7;color:#2A2E55;margin-bottom:10px}
.ev-body ul,.ev-body ol{margin-left:20px}
.ev-past{font-size:15px;color:var(--dim);margin:24px 0 18px}.ev-past a{color:var(--violet);font-weight:600}
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"><i class="a1"></i><i class="a2"></i><i class="a3"></i></div>
<nav class="v2-nav"><div class="v2-wrap">
  <a class="v2-logo" href="/"><img src="/images/landing/logo.png" alt="Flyhunt"></a>
  <div class="v2-links"><a href="/#ai">ИИ-поиск</a><a href="/#base">Своя база</a><a href="/#ats">ATS</a><a href="/pricing/">Тарифы</a><a href="/blog/">Блог</a></div>
  <div class="v2-right"><a class="v2-tariffs" href="/pricing/">Тарифы</a><a class="v2-login" href="https://app.flyhunt.ai">Войти</a><a class="v2-btn" href="https://app.flyhunt.ai/auth/signup?utm_source=flyhunt.ai&amp;utm_medium=site&amp;utm_campaign=free-ats&amp;utm_content=events">Зарегистрироваться</a></div>
</div></nav>
<main class="container page-wrap">
  <a class="back" href="/events/">← Все ивенты</a>
  <div id="content">Загрузка…</div>
</main>
<footer class="v2-footer"><div class="v2-wrap">
  <span>© <span id="year">2026</span> Flyhunt Ltd · Астана</span>
  <div class="f-links"><a href="https://chat.whatsapp.com/EUENkEORTBQGJ44jCIe3ko" target="_blank" rel="noopener">Сообщество AI для HR</a><a href="/events/">Ивенты</a><a href="/training/">Обучение ИИ</a><a href="https://wa.me/77769819589?text=%D0%97%D0%B4%D1%80%D0%B0%D0%B2%D1%81%D1%82%D0%B2%D1%83%D0%B9%D1%82%D0%B5%2C%20%D2%9A%D0%BE%D1%80%D0%BB%D0%B0%D0%BD!%20%D0%AF%20%D1%81%20%D1%81%D0%B0%D0%B9%D1%82%D0%B0%20Flyhunt.%20%D0%A5%D0%BE%D1%87%D1%83%20%D0%BE%D0%B1%D1%81%D1%83%D0%B4%D0%B8%D1%82%D1%8C%20%D0%BF%D0%BE%D0%B4%D0%B1%D0%BE%D1%80%20%D0%BF%D0%BE%D0%B4%20%D0%BA%D0%BB%D1%8E%D1%87." target="_blank" rel="noopener">Подбор под ключ</a><a href="/oferta/">Оферта</a><a href="/privacy/">Конфиденциальность</a></div>
</div></footer>
<script src="/js/nav.js"></script>
<script>
document.getElementById('year').textContent = new Date().getFullYear();
function fmtDateRu(iso){const d=new Date(iso+'T00:00:00');const m=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];return `${d.getDate()} ${m[d.getMonth()]} ${d.getFullYear()}`;}
const slug = new URLSearchParams(location.search).get('slug');
fetch('/content/events.json',{cache:'no-store'}).then(r=>r.json()).then(data=>{
  const e = (data.items||[]).find(x=>x.slug===slug);
  const el = document.getElementById('content');
  if(!e){ el.innerHTML='<p style="color:var(--dim)">Ивент не найден. <a href="/events/">Вернуться к списку</a></p>'; return; }
  const isPast = e.date < new Date().toISOString().slice(0,10);
  document.getElementById('pageTitle').textContent = e.title + ' — Flyhunt';
  document.getElementById('pageDesc').setAttribute('content', e.excerpt||'');
  el.innerHTML = `
    <div class="ev-cover">${e.cover?`<img src="${e.cover}" alt="">`:'AI×HR'}</div>
    <div class="event-badges"><span class="badge">${e.format}</span><span class="badge date">${fmtDateRu(e.date)} · ${e.time}</span><span class="badge">${e.city}</span></div>
    <h1>${e.title}</h1>
    <div class="ev-body">${e.body}</div>
    ${isPast
      ? '<p class="ev-past">Этот ивент уже прошёл. Анонсы следующих встреч — в <a href="/#community">сообществе AI для HR</a>.</p><a class="btn-grad" href="/events/">Все ивенты</a>'
      : `<a class="btn-grad" href="${e.registerUrl}" target="_blank" rel="noopener">Зарегистрироваться в WhatsApp</a>`}`;
}).catch(()=>{ document.getElementById('content').innerHTML='<p style="color:var(--dim)">Не удалось загрузить ивент.</p>'; });
</script>
</body>
</html>
