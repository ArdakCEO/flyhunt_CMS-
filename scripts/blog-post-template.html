<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Сгенерировано scripts/build-blog.js из content/blog.json. Руками не править — правьте статью в CMS и перезапустите скрипт. -->
<title>{{seoTitle}}</title>
<meta name="description" content="{{desc}}">
<link rel="canonical" href="{{url}}">
<meta property="og:title" content="{{seoTitle}}">
<meta property="og:description" content="{{desc}}">
<meta property="og:url" content="{{url}}">
<meta property="og:type" content="article">
<meta property="og:image" content="{{ogImage}}">
<link rel="icon" type="image/png" href="/images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/main.css">
<link rel="stylesheet" href="/css/site-v2-chrome.css">
<style>
.page-wrap{padding:56px 24px 96px;max-width:760px;margin:0 auto}

.art-cover{height:260px;border-radius:var(--radius);background:linear-gradient(120deg,#C9B8FC,#BDE7FC);display:flex;align-items:center;justify-content:center;font-size:56px;margin-bottom:28px;overflow:hidden}
.art-cover img{width:100%;height:100%;object-fit:cover}
.art-date{font-size:13px;color:var(--dim);font-weight:600;display:block;margin-bottom:8px}
h1{font-size:clamp(28px,4vw,42px);line-height:1.15;margin-bottom:24px}
.art-body p{font-size:16.5px;line-height:1.75;color:#2A2E55;margin-bottom:16px}
.art-body h2{font-size:clamp(22px,2.6vw,28px);line-height:1.25;margin:36px 0 14px}
.art-body h3{font-size:clamp(18px,2.2vw,21px);line-height:1.3;margin:28px 0 12px}
.art-body ul,.art-body ol{margin:0 0 18px 22px}
.art-body li{font-size:16.5px;line-height:1.75;color:#2A2E55;margin-bottom:8px}
.art-body a{color:var(--violet);font-weight:600}
.art-body strong{font-weight:700;color:#1A1E3F}
.art-body img{max-width:100%;height:auto;border-radius:var(--radius);margin:8px 0 20px}
.art-body blockquote{margin:0 0 18px;padding:2px 0 2px 18px;border-left:3px solid var(--violet);color:#40456F}
.art-body code{background:rgba(120,90,255,.08);border-radius:6px;padding:2px 6px;font-size:14.5px}
.art-body pre{background:rgba(20,20,50,.05);border-radius:var(--radius);padding:16px;overflow:auto;margin-bottom:18px}
.art-body pre code{background:none;padding:0}
.art-body hr{border:0;border-top:1px solid rgba(20,20,50,.12);margin:32px 0}
.art-meta{font-size:13.5px;color:var(--dim);margin:-10px 0 22px}
.art-meta a{color:var(--violet);font-weight:600}
.art-sub{font-size:15px;color:var(--dim);margin:-14px 0 18px}
.art-lead{background:rgba(139,92,248,.08);border-radius:var(--radius);padding:20px 22px;margin:0 0 26px}
.art-lead p{font-size:16.5px;line-height:1.7;color:#1A1E3F;margin:0 0 10px}
.art-lead p:last-child{margin:0}
.art-body table{width:100%;border-collapse:collapse;margin:8px 0 20px;font-size:15.5px}
.art-body th,.art-body td{text-align:left;padding:9px 11px;border-bottom:1px solid rgba(20,20,50,.12);vertical-align:top}
.art-body th{background:rgba(139,92,248,.08)}
.art-faq details{border-bottom:1px solid rgba(20,20,50,.12);padding:14px 0}
.art-faq summary{cursor:pointer;font-weight:700;font-size:16.5px}
.art-faq p{margin:10px 0 0}
.art-cta{margin-top:34px}
</style>
<script type="application/ld+json">
{{ld}}
</script>
</head>
<body>
<div class="aurora" aria-hidden="true"><i class="a1"></i><i class="a2"></i><i class="a3"></i></div>
<nav class="v2-nav"><div class="v2-wrap">
  <a class="v2-logo" href="/"><img src="/images/landing/logo.png" alt="Flyhunt"></a>
  <div class="v2-links"><a href="/#ai">ИИ-поиск</a><a href="/#base">Своя база</a><a href="/#ats">ATS</a><a href="/pricing/">Тарифы</a><a href="/blog/" class="on">Блог</a></div>
  <div class="v2-right"><a class="v2-tariffs" href="/pricing/">Тарифы</a><a class="v2-login" href="https://app.flyhunt.ai">Войти</a><a class="v2-btn" href="https://app.flyhunt.ai/auth/signup?utm_source=flyhunt.ai&amp;utm_medium=site&amp;utm_campaign=free-ats&amp;utm_content=blog">Зарегистрироваться</a></div>
</div></nav>
<main class="container page-wrap">
  <a class="back" href="/blog/">← Все статьи</a>
  <article>
    <div class="art-cover">{{cover}}</div>
    <h1>{{h1}}</h1>
    {{sub}}
    <p class="art-meta">{{meta}}</p>
    {{lead}}
    <div class="art-body">
{{body}}
{{after}}
{{faq}}
    </div>
    {{cta}}
  </article>
</main>
<footer class="v2-footer"><div class="v2-wrap">

<script src="/js/nav.js"></script>
</body>
</html>
